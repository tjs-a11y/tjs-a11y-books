name: IndexNow ping
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/indexnow.yml'
      - 'index.html'
      - 'crypto/**'
      - 'kitchen/**'
      - 'mastering-cryptocurrency-trading/**'
      - 'mastering-the-crypto-market/**'
      - 'mediterranean-diet-recipes-book/**'
      - 'bitcoin-halving-book/**'
      - 'unlocking-crypto-riches/**'
      - 'maximum-crypto-profits/**'
      - 'unraveling-daos/**'
      - 'revolutionizing-finance/**'
      - 'plant-based-diet-recipes-book/**'
      - 'mindset-mastery/**'
      - 'reading-guides/**'
      - 'sitemap.xml'
  schedule:
    # Midnight Central Standard Time (06:00 UTC); scheduled runs use UTC year-round.
    - cron: '10 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-hub-indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build URL list from the live sitemap source
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          sitemap = ET.parse("sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = sorted({node.text.strip() for node in sitemap.findall(".//sm:loc", ns) if node.text})
          expected = "https://tjs-a11y.github.io/tjs-a11y-books/"
          bad = [u for u in urls if not u.startswith(expected)]
          if bad:
              raise SystemExit("Unexpected sitemap host/path(s): " + ", ".join(bad))
          if not urls:
              raise SystemExit("Sitemap contains no URLs; refusing empty IndexNow request.")
          payload = {
              "host": "tjs-a11y.github.io",
              "key": "35c6143e41ee45c7bccb6737eda0183736e67a46",
              "keyLocation": expected + "35c6143e41ee45c7bccb6737eda0183736e67a46.txt",
              "urlList": urls
          }
          Path("/tmp/indexnow-payload.json").write_text(json.dumps(payload))
          print(f"Prepared {len(urls)} sitemap URLs for IndexNow.")
          PY

      - name: Wait for GitHub Pages deployment
        run: sleep 90

      - name: Verify key file and submit all sitemap URLs
        run: |
          BASE='https://tjs-a11y.github.io/tjs-a11y-books'
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors "$BASE/35c6143e41ee45c7bccb6737eda0183736e67a46.txt" >/dev/null
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow-payload.json)
          echo "IndexNow HTTP $code"
          cat /tmp/resp.txt || true
          case "$code" in 200|202) echo 'IndexNow accepted sitemap URLs.' ;; *) echo 'IndexNow rejected submission.'; exit 1 ;; esac
